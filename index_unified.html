<!DOCTYPE html>
<html lang="ja">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>ESP 3D シミュレーター - 複数ビューモード</title>
    <!-- Tailwind CSS -->
    <script src="https://cdn.tailwindcss.com"></script>
    <!-- Three.js -->
    <script src="https://cdnjs.cloudflare.com/ajax/libs/three.js/r128/three.min.js"></script>
    <!-- Google Fonts -->
    <link href="https://fonts.googleapis.com/css2?family=Noto+Sans+JP:wght@400;700;900&display=swap" rel="stylesheet">
    <style>
        body {
            font-family: 'Noto Sans JP', sans-serif;
        }

        @keyframes pulse-orange {
            0%, 100% { transform: scale(1); opacity: 1; filter: drop-shadow(0 0 2px rgba(249, 115, 22, 0.7)); }
            50% { transform: scale(1.1); opacity: 0.4; filter: drop-shadow(0 0 15px rgba(249, 115, 22, 1)); }
        }

        .active-esp-lamp {
            animation: pulse-orange 0.6s infinite;
        }

        /* タブスタイル */
        .tabs-container {
            display: flex;
            border-bottom: 2px solid #334155;
            background: #0f172a;
        }

        .tab-button {
            padding: 16px 24px;
            cursor: pointer;
            font-weight: 600;
            font-size: 1rem;
            color: #94a3b8;
            transition: all 0.3s;
            border-bottom: 3px solid transparent;
            margin-bottom: -2px;
        }

        .tab-button:hover {
            color: #cbd5e1;
            background: #1e293b;
        }

        .tab-button.active {
            color: #3b82f6;
            border-bottom-color: #3b82f6;
        }

        .tab-content {
            display: none;
        }

        .tab-content.active {
            display: block;
        }

        /* Claude ビュー - 元のスタイル */
        #claude-view {
            background: #f5f7fa;
            color: #22303c;
        }

        /* Gemini ビュー - Tailwind ダーク */
        #gemini-view {
            background: #0f172a;
            color: #e2e8f0;
        }

        @keyframes fadeIn {
            from { opacity: 0; }
            to { opacity: 1; }
        }

        .tab-content.active {
            animation: fadeIn 0.3s ease-in;
        }
    </style>
</head>
<body class="bg-slate-950 text-slate-100">

    <!-- タブヘッダー -->
    <div class="tabs-container">
        <button class="tab-button active" data-tab="claude">
            🤖 Claude - オリジナルビュー
        </button>
        <button class="tab-button" data-tab="gemini">
            ✨ Gemini Enterprise
        </button>
    </div>

    <!-- Claude ビュー（元のindex.html） -->
    <div id="claude-view" class="tab-content active">
        <!-- Claude版のコンテンツをここに挿入 -->
        <iframe src="index.html" style="width: 100%; height: 100vh; border: none;"></iframe>
    </div>

    <!-- Gemini ビュー（gemini.html） -->
    <div id="gemini-view" class="tab-content">
        <!-- Gemini版のコンテンツをここに挿入 -->
        <iframe src="gemini.html" style="width: 100%; height: 100vh; border: none;"></iframe>
    </div>

    <script>
        // タブ切替機能
        const tabButtons = document.querySelectorAll('.tab-button');
        const tabContents = document.querySelectorAll('.tab-content');

        tabButtons.forEach(button => {
            button.addEventListener('click', () => {
                const tabName = button.getAttribute('data-tab');

                // 全てのタブとコンテンツを非アクティブにする
                tabButtons.forEach(btn => btn.classList.remove('active'));
                tabContents.forEach(content => content.classList.remove('active'));

                // クリックされたタブをアクティブにする
                button.classList.add('active');
                document.getElementById(tabName + '-view').classList.add('active');

                // タブ情報をlocalStorageに保存
                localStorage.setItem('activeTab', tabName);
            });
        });

        // ページロード時に前回選択していたタブを復元
        window.addEventListener('load', () => {
            const savedTab = localStorage.getItem('activeTab') || 'claude';
            const savedButton = Array.from(tabButtons).find(btn => btn.getAttribute('data-tab') === savedTab);
            if (savedButton) {
                savedButton.click();
            }
        });
    </script>

</body>
</html>
